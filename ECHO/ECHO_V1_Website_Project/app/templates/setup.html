<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set up ECHO</title><link rel="stylesheet" href="/static/style.css"></head><body class="auth"><form class="auth-card" method="post" action="/setup"><div class="mark">E</div><h1>Set up ECHO</h1><p>Create the owner account. Use a unique password of at least 14 characters.</p><label>Owner username<input name="username" minlength="3" required autocomplete="username"></label><label>Master password<input type="password" name="password" minlength="14" required autocomplete="new-password"></label><label>Confirm password<input type="password" name="confirm" minlength="14" required autocomplete="new-password"></label><button>Create owner account</button><small>Your password is hashed; it is not stored in plaintext.</small></form></body></html>
