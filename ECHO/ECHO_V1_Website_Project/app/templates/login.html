<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in to ECHO</title><link rel="stylesheet" href="/static/style.css"></head><body class="auth"><form class="auth-card" method="post" action="/login"><div class="mark">E</div><h1>Welcome back</h1><p>Sign in to your ECHO owner account.</p>{% if error %}<p class="error">{{error}}</p>{% endif %}<label>Username<input name="username" required autocomplete="username"></label><label>Master password<input type="password" name="password" required autocomplete="current-password"></label><button>Log in</button></form></body></html>
